services:
  api:
    build: .
    ports:
      # host:container - change the host side (left number) if 8000 is taken
      - "8000:8000"
    environment:
      # Required by app/api/routes.py's verify_api_key dependency.
      # Put a real secret in a local .env file (see .env.example) - never
      # commit the actual value.
      - API_KEY=${API_KEY}
    volumes:
      # Mount data/ so downloaded datasets and trained models persist across
      # container restarts instead of vanishing when the container is removed.
      - ./data:/code/data
    # Uncomment if you add a docker-managed database later:
    # depends_on:
    #   - db